name: ci

on:
  push:
    branches: [develop, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r lint
      - run: pnpm -r test
      - run: pnpm --dir spikes/agent-sdk --ignore-workspace install --frozen-lockfile
      - run: pnpm --dir spikes/agent-sdk test
      - run: pnpm --dir spikes/isolation --ignore-workspace install --frozen-lockfile
      - run: pnpm --dir spikes/isolation test
      - run: pnpm --dir spikes/agile-plugin --ignore-workspace install --frozen-lockfile
      - run: pnpm --dir spikes/agile-plugin test
