schemaVersion: friday/v1
enabled: true
repository:
  owner: alexcanario
  name: friday-sandbox
  base: main
verify:
  command: pnpm -r test
  timeout_s: 900
flow:
  screen_paths:
    - "**/*.razor"
  pr_evidence: true
  triage:
    model: haiku
    max_budget_usd: 0.5
risk:
  rules: [migrations, infra, ci, dependencies, secrets, agent_config, size]
  max_changed_lines: 2000
  max_changed_files: 50
pull_requests:
  merge: manual
  author_token_env: FRIDAY_AUTHOR_TOKEN
  review_token_env: FRIDAY_REVIEW_TOKEN
limits:
  per_issue_usd: 5
  per_day_usd: 10
  approval_expires_min: 30
secrets:
  - ANTHROPIC_API_KEY
