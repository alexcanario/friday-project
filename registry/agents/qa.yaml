role: qa
states: [QA]
model: sonnet
max_budget_usd: 1.5
max_turns: 40
timeout_s: 1800
tools: [Read, Glob, Grep, Bash]
mcp_tools:
  - qa_report
  - issue_comment
bash_allow:
  - "pnpm test"
  - "pnpm -r test"
  - "git log"
  - "git diff"
  - "git diff origin/develop...HEAD"
  - "git diff --stat origin/develop...HEAD"
  - "git log --oneline origin/develop..HEAD"
output: qaReport
prompt_file: prompts/qa.md
